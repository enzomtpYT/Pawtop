name: Update AUR

# Keeps https://aur.archlinux.org/packages/pawtop in sync with releases.
# Runs after the Release workflow finishes a version tag build,
# or manually via workflow_dispatch.
#
# Required secret (Settings > Secrets and variables > Actions):
#   AUR_SSH_KEY - private SSH key linked to an AUR account with push access to the pawtop package.

on:
    workflow_run:
        workflows: ["Release"]
        types: [completed]
    workflow_dispatch:
        inputs:
            version:
                description: "Version without the leading v (e.g. 3.3.1)."
                required: true

permissions:
    contents: read

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            ver: ${{ steps.ver.outputs.ver }}
            skip: ${{ steps.ver.outputs.skip }}
        steps:
            - name: Resolve version
              id: ver
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      VER="${{ inputs.version }}"
                  else
                      TAG="${{ github.event.workflow_run.head_branch }}"
                      case "$TAG" in
                          v*) VER="${TAG#v}" ;;
                          *)
                              echo "Release run was for '$TAG', not a version tag. Nothing to do."
                              echo "skip=true" >> "$GITHUB_OUTPUT"
                              exit 0
                              ;;
                      esac
                  fi
                  if [ -z "$VER" ]; then
                      echo "Could not resolve version" >&2
                      exit 1
                  fi
                  echo "ver=$VER" >> "$GITHUB_OUTPUT"
                  echo "Updating AUR package to $VER"

    aur:
        needs: resolve
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && needs.resolve.outputs.skip != 'true' }}
        runs-on: ubuntu-latest
        container: archlinux:latest
        steps:
            - name: Install dependencies
              run: pacman -Syu --noconfirm --needed base-devel git openssh curl

            - name: Fetch release tarball checksum
              id: tar
              run: |
                  curl -sSL --retry 5 --retry-all-errors -o release.tar.gz "https://github.com/enzomtpYT/Pawtop/archive/refs/tags/v${{ needs.resolve.outputs.ver }}.tar.gz"
                  echo "sha=$(sha256sum release.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Determine required Electron package
              id: electron
              run: |
                  MAJOR=$(curl -sSL "https://raw.githubusercontent.com/enzomtpYT/Pawtop/v${{ needs.resolve.outputs.ver }}/package.json" | grep -m1 '"electron":' | grep -o '[0-9]\+' | head -1)
                  if [ -z "$MAJOR" ]; then
                      echo "Could not determine electron version from package.json" >&2
                      exit 1
                  fi
                  echo "pkg=electron$MAJOR" >> "$GITHUB_OUTPUT"

            - name: Set up SSH for AUR
              run: |
                  SSH_DIR="$HOME/.ssh"
                  mkdir -p "$SSH_DIR"
                  chmod 700 "$SSH_DIR"
                  printf '%s\n' "${{ secrets.AUR_SSH_KEY }}" > "$SSH_DIR/aur"
                  chmod 600 "$SSH_DIR/aur"
                  # Scan all host key types and fail fast if we got nothing
                  ssh-keyscan aur.archlinux.org > "$SSH_DIR/known_hosts" 2>/dev/null
                  test -s "$SSH_DIR/known_hosts"
                  ssh-keygen -l -f "$SSH_DIR/known_hosts"
                  printf 'Host aur.archlinux.org\n\tIdentityFile %s/aur\n\tIdentitiesOnly yes\n\tUserKnownHostsFile %s/known_hosts\n' "$SSH_DIR" "$SSH_DIR" > "$SSH_DIR/config"
                  echo "AUR_SSH_DIR=$SSH_DIR" >> "$GITHUB_ENV"

            - name: Clone AUR package
              env:
                  GIT_SSH_COMMAND: ssh -i ${{ env.AUR_SSH_DIR }}/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ env.AUR_SSH_DIR }}/known_hosts
              run: git clone ssh://aur@aur.archlinux.org/pawtop.git "${GITHUB_WORKSPACE}/aur-pkg"

            - name: Update PKGBUILD
              run: |
                  cd "${GITHUB_WORKSPACE}/aur-pkg"
                  test -d .git
                  VER="${{ needs.resolve.outputs.ver }}"
                  TAR_SHA="${{ steps.tar.outputs.sha }}"
                  ELECTRON_PKG="${{ steps.electron.outputs.pkg }}"

                  CUR_VER=$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)
                  CUR_REL=$(grep -m1 '^pkgrel=' PKGBUILD | cut -d= -f2)
                  if [ "$CUR_VER" = "$VER" ]; then
                      REL=$((CUR_REL + 1))
                  else
                      REL=1
                  fi

                  sed -i "s/^pkgver=.*/pkgver=$VER/" PKGBUILD
                  sed -i "s/^pkgrel=.*/pkgrel=$REL/" PKGBUILD

                  # First sha256sum corresponds to the release tarball
                  OLD_TAR_SHA=$(grep -o "'[0-9a-f]\{64\}'" PKGBUILD | sed -n '1p')
                  sed -i "s/$OLD_TAR_SHA/'$TAR_SHA'/" PKGBUILD

                  # Keep the system electron pin in sync with package.json (e.g. electron43).
                  # pawtop.sh is the 3rd entry in source()/sha256sums().
                  CUR_ELECTRON=$(grep -m1 '^electron=' PKGBUILD | cut -d= -f2)
                  if [ "$CUR_ELECTRON" != "$ELECTRON_PKG" ]; then
                      sed -i "s/^electron=.*/electron=$ELECTRON_PKG/" PKGBUILD
                      sed -i "s|^exec electron[0-9]* |exec $ELECTRON_PKG |" pawtop.sh
                      SH_SHA=$(sha256sum pawtop.sh | cut -d' ' -f1)
                      OLD_SH_SHA=$(grep -o "'[0-9a-f]\{64\}'" PKGBUILD | sed -n '3p')
                      sed -i "s/$OLD_SH_SHA/'$SH_SHA'/" PKGBUILD
                  fi

                  bash -n PKGBUILD
                  bash -n pawtop.sh

            - name: Regenerate .SRCINFO
              run: |
                  cd "${GITHUB_WORKSPACE}/aur-pkg"
                  useradd -m builder
                  chown -R builder:builder .
                  su builder -s /bin/bash -c 'makepkg --printsrcinfo > .SRCINFO'
                  chown -R root:root .

            - name: Push to AUR
              env:
                  GIT_SSH_COMMAND: ssh -i ${{ env.AUR_SSH_DIR }}/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ env.AUR_SSH_DIR }}/known_hosts
              run: |
                  cd "${GITHUB_WORKSPACE}/aur-pkg"
                  test -d .git
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  if [ -z "$(git status --porcelain)" ]; then
                      echo "Nothing to update"
                      exit 0
                  fi
                  git add PKGBUILD .SRCINFO pawtop.sh
                  git commit -m "Update to v${{ needs.resolve.outputs.ver }}"
                  git push origin master
